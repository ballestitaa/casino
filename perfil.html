<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="d-flex flex-column min-vh-100">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  
   <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        
        <a class="navbar-brand" href="#">
          <img src="/imgs/logo.png" alt="Logo" width="30" height="24" class="d-inline-block align-text-top">
          ROYALSPIN
        </a>

        <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
          
          <div class="navbar-nav">
            <a class="nav-link active" aria-current="page" href="#">Inicio</a>
            <a class="nav-link" href="#juegos">Juegos</a>
            <a class="nav-link" href="#">Leaderboard</a>
          </div>

          <!--PERFIL-->
          <div class="navbar-nav ms-auto align-items-center">
            <a href="#" class="nav-link">
                  <img width="40px" height="40px" class="rounded-circle" src="https://i.pravatar.cc/300" alt="Perfil">
                  <span style="margin-left: 10px;">Mi perfil</span>
            </a>
          </div>
          
        </div>

      </div>
    </nav>
    <div class="container d-flex flex-column justify-content-center align-items-center flex-grow-1 p-5">
        <div class="row w-100 align-items-center">
            <!-- foto, nombre y saldo -->
            <div class="col-md-3 d-flex flex-column justify-content-center flex-grow-1">
                <div>
                    <img class="rounded-circle mb-3" src="https://i.pravatar.cc/300" alt="Foto de perfil">
                    <h1 class="mt-2">Nombre</h1>
                    <h2>Saldo Actual: <span class="text-warning">100$</span></h2>
                </div>
            </div>

            <div class="col-md-3">
                <table class="table">
                    <thead>
                        <tr>
                        <th scope="col">Última Ganancia</th>
                        <th scope="col">Juego</th>
                        </tr>
                    </thead>
                    <table class="table table-dark table-striped">
                        <tr>
                            <th scope="row" class="text-success">+150$</th>
                            <td>Ruleta</td>
                        </tr>
                        <tr>
                            <th scope="row" class="text-danger">-30$</th>
                            <td>Blackjack</td>
                        </tr>
                        <tr>
                            <th scope="row" class="text-success">+500$</th>
                            <td>Tragaperras</td>
                        </tr>
                        <tr>
                            <th scope="row" class="text-success">+75$</th>
                            <td>Póker</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="col-md-3">
                <h3 class="mb-3">Mejores Wins</h3>
                <table class="table table-dark table-striped">
                    <thead>
                        <tr>
                            <th scope="col">Premio</th>
                            <th scope="col">Juego</th>
                        </tr>
                    </thead>
                    <tbody class="table-group-divider">
                        <tr>
                            <th scope="row" class="text-success">+2,500$</th>
                            <td>Gates of Olympus</td>
                        </tr>
                        <tr>
                            <th scope="row" class="text-success">+1,200$</th>
                            <td>Sweet Bonanza</td>
                        </tr>
                        <tr>
                            <th scope="row" class="text-success">+850$</th>
                            <td>Ruleta en Vivo</td>
                        </tr>
                        <tr>
                            <th scope="row" class="text-success">+500$</th>
                            <td>Blackjack</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            

        </div>
    </div>  

  </body>
</html>
