<!doctype html>
<html lang="es" data-bs-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear cuenta · RoyalSpin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="signup-page d-flex align-items-center justify-content-center min-vh-100">

    <a href="index.html" class="btn btn-outline-light btn-sm position-absolute top-0 start-0 m-3 m-sm-4">
      ← Volver al inicio
    </a>

    <div class="login-card card bg-dark text-white p-4 p-sm-5 border-warning my-5">
      <div class="text-center mb-4">
        <img src="/imgs/logo.png" alt="Logo" width="40" height="32" class="mb-2">
        <h1 class="h4 fw-bold mb-0">ROYALSPIN</h1>
      </div>

      <h2 class="h3 fw-bold text-center mb-4">Crear cuenta</h2>

      <form>
        <div class="mb-3">
          <label for="usuario" class="form-label text-uppercase small">Nombre de usuario</label>
          <input type="text" class="form-control form-control-lg" id="usuario" placeholder="TuNombre" required>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label text-uppercase small">Correo electrónico</label>
          <input type="email" class="form-control form-control-lg" id="email" placeholder="ejemplo@correo.com" required>
        </div>

        <div class="mb-3">
          <label for="nacimiento" class="form-label text-uppercase small">Fecha de nacimiento</label>
          <input type="date" class="form-control form-control-lg" id="nacimiento" required>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label text-uppercase small">Contraseña</label>
          <input type="password" class="form-control form-control-lg" id="password" placeholder="••••••••••" minlength="6" required>
        </div>

        <div class="form-check mb-4">
          <input class="form-check-input" type="checkbox" id="terminos" required>
          <label class="form-check-label small text-body-secondary" for="terminos">
            Acepto los términos y condiciones
          </label>
        </div>

        <button type="submit" class="btn btn-warning btn-lg w-100 fw-bold">Crear cuenta</button>

        <p class="text-center small text-body-secondary mt-4 mb-0">
          ¿Ya tienes cuenta?
          <a href="login.html" class="link-warning fw-bold text-decoration-none">Inicia sesión</a>
        </p>
      </form>
    </div>

  </body>
</html>
