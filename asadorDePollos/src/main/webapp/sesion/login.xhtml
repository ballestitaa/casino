<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                template="/WEB-INF/templates/templateAuth.xhtml"
                xmlns:p="primefaces">

    <ui:define name="title">Iniciar sesión</ui:define>

    <ui:define name="content">
        <div class="login-card card bg-dark text-white p-4 p-sm-5 border-warning">
            <div class="text-center mb-4">
                <img src="#{request.contextPath}/resources/imgs/logo.png" alt="Logo" width="40" height="32" class="mb-2" />
                <h1 class="h4 fw-bold mb-0">ROYALSPIN</h1>
            </div>

            <h2 class="h3 fw-bold text-center mb-4">Iniciar sesión</h2>

            <h:form id="formLogin" styleClass="row g-3">
                <div class="col-12">
                    <p:messages id="msgs" globalOnly="true" closable="true" showDetail="false" showSummary="true" />
                </div>

                <div class="col-12">
                    <label for="usuario" class="form-label text-uppercase small">Usuario</label>
                    <h:inputText id="usuario"
                                 value="#{loginBean.usuario}"
                                 styleClass="form-control form-control-lg"
                    />
                </div>

                <div class="col-12">
                    <label for="password" class="form-label text-uppercase small">Contraseña</label>
                    <h:inputSecret id="password"
                                   value="#{loginBean.password}"
                                   styleClass="form-control form-control-lg"/>
                </div>

                <div class="col-12 text-end">
                    <a href="#" class="link-primary small text-decoration-none">¿Olvidaste tu contraseña?</a>
                </div>

                <div class="col-12">
                    <h:commandButton value="Entrar"
                                     action="#{loginBean.login()}"
                                     styleClass="btn btn-primary btn-lg w-100 fw-bold" />
                </div>

                <div class="col-12">
                    <p class="text-center small text-body-secondary mb-0">
                        ¿No tienes cuenta?
                        <a href="#{request.contextPath}/sesion/signup.xhtml" class="link-primary fw-bold text-decoration-none">Regístrate</a>
                    </p>
                </div>
            </h:form>
        </div>
    </ui:define>

</ui:composition>
