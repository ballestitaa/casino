<ui:component xmlns="http://www.w3.org/1999/xhtml"
              xmlns:ui="jakarta.faces.facelets"
              xmlns:composite="jakarta.faces.composite"
              xmlns:p="primefaces">

  <composite:interface>
    <composite:attribute name="titulo" type="java.lang.String" required="true" />
    <composite:attribute name="lista" type="java.util.List" required="true" />
    <composite:attribute name="visibles" type="java.lang.Integer" default="2" />
    <composite:attribute name="intervalo" type="java.lang.Integer" default="3000" />
    <composite:attribute name="responsive" type="java.util.List" />
  </composite:interface>

  <composite:implementation>
    <h2 class="fw-bold mb-4">#{cc.attrs.titulo}</h2>

    <p:carousel value="#{cc.attrs.lista}" var="juego"
                numVisible="#{cc.attrs.visibles}" numScroll="1"
                circular="true" autoplayInterval="#{cc.attrs.intervalo}"
                responsiveOptions="#{cc.attrs.responsive}"
                styleClass="carrusel-juegos">
      <!-- padding vertical para que el hover (translateY -10px) no se corte -->
      <div class="px-2 py-3 h-100">
        <div class="card h-100 bg-dark text-white border-warning hover-animado">
          <img src="#{request.contextPath}/resources/imgs/juegos/#{juego.imagen}" class="card-img-top img-juego" alt="#{juego.nombre}" />
          <div class="card-body">
            <h3 class="h5 card-title">#{juego.nombre}</h3>
            <p class="card-text text-body-secondary">#{juego.descripcion}</p>
            <a href="#{request.contextPath}#{juego.url}" class="btn btn-primary w-100 fw-bold">Jugar</a>
          </div>
        </div>
      </div>
    </p:carousel>
  </composite:implementation>

</ui:component>
