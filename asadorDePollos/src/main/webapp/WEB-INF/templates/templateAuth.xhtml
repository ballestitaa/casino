<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html lang="es" data-bs-theme="dark"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets">

<h:head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title><ui:insert name="title">Iniciar sesión</ui:insert> · RoyalSpin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous" />
    <h:outputStylesheet library="css" name="styles.css" />
    <ui:insert name="head" />
</h:head>

<h:body styleClass="login-page">
    <a href="#{request.contextPath}" class="btn btn-outline-light btn-sm position-absolute top-0 start-0 m-3 m-sm-4">
        ← Volver al inicio
    </a>

    <main class="container min-vh-100 d-flex align-items-center py-5">
        <div class="row justify-content-center w-100">
            <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">
                <ui:insert name="content" />
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>
    <ui:insert name="scripts" />
</h:body>
</html>
