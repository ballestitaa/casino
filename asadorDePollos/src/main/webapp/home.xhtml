<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="primefaces"
                template="/WEB-INF/templates/template.xhtml"
                xmlns:f="jakarta.faces.core"
                xmlns:comp="jakarta.faces.composite/components">

  <f:metadata>
    <f:viewAction action="#{userBean.comprobarSesion}" />
    <!-- mensaje de bienvenida tras el login (se muestra una vez en el growl) -->
    <f:viewAction action="#{userBean.mostrarBienvenida}" />
  </f:metadata>

  <ui:define name="content">
    <!-- HERO (compacto: sin el min-height de 85vh que usa index) -->
    <header class="hero-section hero-compacto d-flex align-items-center text-center text-white">
      <div class="container pt-5 pb-3">
        <h1 class="display-4 fw-bold">¡BIENVENIDO AL MEJOR CASINO ONLINE!</h1>
        <p class="lead text-body-secondary">Juega y gana premios increíbles con nuestros juegos exclusivos.</p>
        <div class="d-flex justify-content-center gap-3 my-4">
          <a href="#juegos" class="btn btn-primary btn-lg fw-bold">Jugar ahora</a>
          <a href="#{request.contextPath}/leaderboard.xhtml" class="btn btn-outline-primary btn-lg fw-bold">Ver Leaderboard</a>
        </div>
        <div class="d-flex flex-column flex-sm-row justify-content-center gap-4 mt-4">
          <span>🎰 +1000 juegos</span>
          <span>🎁 Bonos diarios</span>
          <span>🎧 Soporte 24/7</span>
        </div>
      </div>
    </header>

    <!-- JUEGOS DESTACADOS -->
    <section id="juegos" class="container pt-4 pb-5">
      <comp:carruselJuegos titulo="Juegos destacados"
                           lista="#{juegoBean.juegos}"
                           visibles="3"
                           intervalo="3000"
                           responsive="#{juegoBean.responsiveOptions}" />
    </section>
  </ui:define>

</ui:composition>
